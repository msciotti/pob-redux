name: ios

# Does the app compile for iOS? Runs on a macOS runner; manual only.
on:
  push:
    branches: [ios-build]
  workflow_dispatch:

jobs:
  check:
    runs-on: macos-latest
    env:
      MACOSX_DEPLOYMENT_TARGET: '14.0'
      # LuaJIT's Makefile guesses the target from the host (Darwin = macOS) and then builds
      # buildvm with the JIT on but the iOS target with it off; say it is iOS.
      TARGET_SYS: iOS
      POB_REDUX_ALLOW_STALE_DIST: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios-sim
      - uses: oven-sh/setup-bun@v2
      - uses: Swatinem/rust-cache@v2
      - run: bun install
      - name: Stub resources dirs so tauri-build passes
        run: mkdir -p src-tauri/resources/pob src-tauri/resources/pob1 src-tauri/resources/pob1-data dist && touch dist/index.html
      - name: cargo check (iOS simulator)
        run: set -o pipefail; cargo check -p pob-redux --lib --target aarch64-apple-ios-sim 2>&1 | tee ios-check.log
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: ios-check-log, path: ios-check.log }

  ipa:
    runs-on: macos-latest
    env:
      MACOSX_DEPLOYMENT_TARGET: '14.0'
    steps:
      - uses: actions/checkout@v7
      - name: Read pinned PoB commit
        id: pin
        run: |
          c=$(awk -v s="[poe1]" '$0 == s {f=1; next} /^\[/ {f=0} f && /^commit/' pob-sync.toml | cut -d'"' -f2)
          echo "commit1=$c" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          repository: PathOfBuildingCommunity/PathOfBuilding
          ref: ${{ steps.pin.outputs.commit1 }}
          path: upstream/PathOfBuilding
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios
      - uses: oven-sh/setup-bun@v2
      - uses: Swatinem/rust-cache@v2
        with: { shared-key: ios-ipa, cache-on-failure: true }
      - run: bun install --frozen-lockfile
      - run: bun run build
      - name: Vendor PoE1 Path of Building
        run: |
          cargo run -p pob-sync -- --game poe1 --source upstream/PathOfBuilding
          mkdir -p src-tauri/resources/pob
      - name: tauri ios init
        run: bun tauri ios init --ci 2>&1 | tee init.log
      - name: Turn off code signing (unsigned build; sideloader signs later)
        run: python3 scripts/ios-nosign.py src-tauri/gen/apple/pob-redux.xcodeproj/project.pbxproj
      - name: Pass LuaJIT build env through Xcode
        # xcodebuild's "Build Rust Code" phase drops MACOSX_DEPLOYMENT_TARGET (it's an iOS SDK build),
        # and LuaJIT's host-tool Makefile refuses to run without it. Cargo [env] survives Xcode.
        run: |
          mkdir -p ~/.cargo
          cat >> ~/.cargo/config.toml <<'EOF'
          [env]
          MACOSX_DEPLOYMENT_TARGET = { value = "14.0", force = true }
          TARGET_SYS = { value = "iOS", force = true }
          EOF
          cat ~/.cargo/config.toml
      - name: Build unsigned app
        env:
          TARGET_SYS: iOS
        run: |
          set -o pipefail
          bun tauri ios build --ci --target aarch64 --debug 2>&1 | tee build.log
      - name: List build products
        if: always()
        run: find src-tauri/gen/apple target -maxdepth 6 \( -name '*.app' -o -name '*.ipa' \) 2>/dev/null | head
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-ipa-logs
          path: |
            init.log
            build.log
            src-tauri/gen/apple/build/**/*.ipa
