name: ios

# Does the app compile for iOS? Runs on a macOS runner; manual only.
on:
  push:
    branches: [ios-build]
  workflow_dispatch:

jobs:
  check:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios-sim
      - uses: oven-sh/setup-bun@v2
      - uses: Swatinem/rust-cache@v2
      - run: bun install
      - name: Stub resources dirs so tauri-build passes
        run: mkdir -p src-tauri/resources/pob src-tauri/resources/pob1 src-tauri/resources/pob1-data build
      - name: cargo check (iOS simulator)
        run: cargo check -p pob-redux --lib --target aarch64-apple-ios-sim 2>&1 | tee ios-check.log
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: ios-check-log, path: ios-check.log }
